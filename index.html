<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101217">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="立体方块">
  <meta name="description" content="方块层层下落，排满一行即可消除。">
  <title>立体方块</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="app">
    <canvas id="view" aria-label="方块棋盘"></canvas>
    <div id="vignette"></div>
    <header id="hud" hidden>
      <div class="stat-grid">
        <div class="stat"><em>分数</em><strong id="hud-score">0</strong></div>
        <div class="stat"><em>最高</em><strong id="hud-best">0</strong></div>
        <div class="stat"><em>等级</em><strong id="hud-level">1</strong></div>
        <div class="stat"><em>消除</em><strong id="hud-lines">0</strong></div>
      </div>
      <div class="hud-btns">
        <button type="button" id="btn-hold">保留</button>
        <button type="button" class="js-mute" aria-pressed="true">声音</button>
        <button type="button" id="btn-pause">暂停</button>
      </div>
    </header>
    <p id="toast" hidden></p>
    <footer id="controls" hidden>
      <button type="button" id="btn-left">左</button>
      <button type="button" id="btn-rot">旋转</button>
      <button type="button" id="btn-soft">加速</button>
      <button type="button" id="btn-hard" class="accent">落底</button>
      <button type="button" id="btn-right">右</button>
    </footer>
    <section id="screen-home" class="screen">
      <div class="home-card">
        <p class="eyebrow">下落消除</p>
        <h1>立体方块</h1>
        <p class="tagline">方块层层下落，排满一行即可消除。</p>
        <p class="best-line">最高分 <strong id="home-best">0</strong></p>
        <button type="button" id="btn-start" class="btn primary">开始游戏</button>
        <ul class="help">
          <li><span>左右滑动</span>移动方块</li>
          <li><span>轻点</span>旋转方块</li>
          <li><span>下滑</span>加速下落</li>
          <li><span>快速下滑</span>直接落底</li>
          <li><span>保留</span>留下当前方块</li>
        </ul>
        <div class="home-tools">
          <button type="button" class="js-mute" aria-pressed="true">声音</button>
        </div>
      </div>
    </section>
    <section id="screen-pause" class="screen" hidden>
      <div class="card">
        <h2>已暂停</h2>
        <p class="sub">局面暂停，随时继续</p>
        <div class="stack">
          <button type="button" id="btn-resume" class="btn primary">继续游戏</button>
          <button type="button" id="btn-pause-restart" class="btn">重新开始</button>
          <button type="button" id="btn-pause-home" class="btn ghost">返回首页</button>
        </div>
      </div>
    </section>
    <section id="screen-over" class="screen" hidden>
      <div class="card">
        <h2>游戏结束</h2>
        <p class="sub">本局得分</p>
        <p class="score-lg" id="over-score">0</p>
        <p class="record" id="over-record" hidden>新纪录</p>
        <p class="sub">最高分 <span id="over-best">0</span></p>
        <div class="stack">
          <button type="button" id="btn-retry" class="btn primary">再来一局</button>
          <button type="button" id="btn-over-home" class="btn ghost">返回首页</button>
        </div>
      </div>
    </section>
    <p id="fatal" class="fatal" hidden></p>
  </div>
  <noscript>请启用 JavaScript 后再玩立体方块。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
